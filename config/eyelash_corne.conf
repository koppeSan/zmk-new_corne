#
# go to sleep after one hour (1*60*60*1000ms)

# ============================================================
# DYA Studio (cormoran/zmk main+dya) - settings shared by both halves
# Central (left) only settings such as ZMK Studio and the custom
# Studio RPC subsystems are in eyelash_corne_left.conf.
# ============================================================

# Bluetooth connections
CONFIG_BT_MAX_CONN=5

# Pointing (mouse keys)
CONFIG_ZMK_POINTING=y

# Battery history (each half records its own history)
CONFIG_SETTINGS=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_HISTORY=y

# Settings RPC (also provides split relay events to the peripheral)
CONFIG_ZMK_SETTINGS_RPC=y

# NOTE: CONFIG_ZMK_KEYMAP_LAYER_MAX does not exist in cormoran/zmk main+dya.
#       The layer count is the number of layers in the keymap (including
#       status = "reserved" layers), so extra layers are added in the keymap.

CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

CONFIG_ZMK_SLEEP=y




# Zephyr 4.1: CONFIG_WS2812_STRIP was removed; the ws2812 driver is enabled from devicetree
CONFIG_LED_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n

CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=160
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3

# Uncomment the following line to enable NKRO
#CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

# Some operating systems have problems with full support for consumer keycodes.
# Uncomment the following line if keycodes labeled "consumer" like C_AC_SEARCH don't work
#CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y

#EC11 enable
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_BRT_START=100
# Uncomment the following line to increase the keyboard's wireless range
#CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=20
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=20
