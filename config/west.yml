manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: cormoran
      url-base: https://github.com/cormoran
      # Additional modules containing boards/shields/custom code can be listed here as well.
      # See:
      # - https://zmk.dev/docs/features/modules
      # - https://docs.zephyrproject.org/3.5.0/develop/west/manifest.html#projects
  projects:
    # Eyelash Corne shield definition (nice_nano_v2 + eyelash_corne_left/right)
    - name: eyelash_corne
      url: https://github.com/a741725193/zmk-new_corne
      revision: main
    # ZMK fork with DYA Studio (custom Studio RPC) support (Zephyr 4.1)
    - name: zmk
      remote: cormoran
      revision: main+dya
      import: app/west.yml
      clone-depth: 1
    - name: zephyr
      remote: cormoran
      revision: v4.1.0+zmk-fixes+nrf-half-duplex-uart
      clone-depth: 1
      import:
        name-blocklist:
          - ci-tools
          - hal_altera
          - hal_cypress
          - hal_infineon
          - hal_microchip
          - hal_nxp
          - hal_openisa
          - hal_xtensa
          - hal_st
          - hal_ti
          - loramac-node
          - mcuboot
          - mcumgr
          - net-tools
          - openthread
          - edtt
          - trusted-firmware-m
          - chre
    # Required by the eyelash_corne shield config (CONFIG_ZMK_RUNTIME_SENSOR_ROTATE)
    - name: zmk-behavior-runtime-sensor-rotate
      remote: cormoran
      revision: main
    # DYA Studio feature modules
    - name: zmk-feature-custom-settings
      remote: cormoran
      revision: main
    - name: zmk-feature-runtime-combo
      remote: cormoran
      revision: main
    - name: zmk-feature-runtime-macro
      remote: cormoran
      revision: main
    - name: zmk-module-runtime-input-processor
      remote: cormoran
      revision: main
    - name: zmk-module-ble-management
      remote: cormoran
      revision: main
    - name: zmk-module-battery-history
      remote: cormoran
      revision: main
    # Also provides CONFIG_ZMK_SPLIT_RELAY_EVENT (split relay event) support
    - name: zmk-module-settings-rpc
      remote: cormoran
      revision: main
    - name: zmk-feature-os-detection
      remote: cormoran
      revision: main
    - name: zmk-feature-device-info
      remote: cormoran
      revision: main
  self:
    path: config
